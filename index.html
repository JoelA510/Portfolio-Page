<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Two tags so the correct color shows via pure CSS media-matching with
         no JS at all (matches the OS preference by default, same as before
         theme toggling existed). Once the user has an explicit override, the
         pre-mount script below and src/hooks/useTheme.ts set BOTH tags'
         content to the same color — whichever one the OS is currently
         matching then renders that color regardless of which query "wins",
         so an explicit choice that differs from the OS still displays
         correctly, without ever requiring JS to run. -->
    <meta name="theme-color" content="#161613" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />

    <title>Joel Abraham — Systems Reliability & Automation Specialist</title>
    <meta
      name="description"
      content="Joel Abraham's portfolio across IT systems administration, cybersecurity risk & access control, logistics operations, building maintenance, and AI-directed software engineering — 15+ years of hands-on operations, now security-certified."
    />
    <meta name="author" content="Joel Abraham" />
    <meta
      name="keywords"
      content="Joel Abraham, IT systems administrator, cybersecurity, CompTIA Security+, ISC2 Certified in Cybersecurity, CompTIA A+, AWS Certified Cloud Practitioner, logistics operations, facilities maintenance, AI-augmented software engineer, TypeScript, React, Supabase"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://secureyour.tech/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights src/index.css actually uses: Jakarta 400/500/600/700
         upright (no italics, no 300/800), JetBrains Mono 400 (no bold/italic). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joel Abraham" />
    <meta property="og:title" content="Joel Abraham — Systems Reliability & Automation Specialist" />
    <meta
      property="og:description"
      content="A portfolio across IT, cybersecurity, logistics, building maintenance, and AI-directed software engineering — 15+ years of hands-on operations, now security-certified."
    />
    <meta property="og:url" content="https://secureyour.tech/" />
    <meta property="og:image" content="https://secureyour.tech/og-image.svg" />

    <meta property="og:image:height" content="630" />

      property="og:image:alt"
      content="Joel Abraham — Systems Reliability & Automation Specialist. IT, Cybersecurity, Logistics, Facilities, and AI-directed Software Engineering."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joel Abraham — Systems Reliability & Automation Specialist" />
    <meta
      name="twitter:description"
      content="A portfolio across IT, cybersecurity, logistics, building maintenance, and AI-directed software engineering — 15+ years of hands-on operations, now security-certified."
    />
    <meta name="twitter:image" content="https://secureyour.tech/og-image.svg" />
    <meta
      name="twitter:image:alt"
      content="Joel Abraham portfolio — IT, Cybersecurity, Logistics, Facilities, and AI-directed Software Engineering."
    />

    <!--
      Pre-mount theme hydration.

      CSS tokens live under :root[data-theme="..."], so the attribute must be
      set before first paint. Reads the same localStorage key as
      src/hooks/useTheme.ts ("best-theme"); falls back to OS preference.
      Also seeds both theme-color metas above so mobile browser chrome
      matches on first paint when there's a stored override that differs
      from the OS; kept in sync afterwards by useTheme.ts. This literal color
      map is unavoidable here — it's a synchronous bootstrap script that runs
      before src/index.css (and its --paper token) has loaded, specifically
      so it can set data-theme before first paint. Keep in sync with --paper
      in src/index.css. querySelectorAll + forEach is used (rather than a
      single querySelector) so a missing/renamed meta tag is a silent no-op,
      not a thrown error that would fall into the catch below and discard
      the theme this script just resolved.
    -->
    <script>
      (function () {
        var PAPER = { light: "#FAF9F6", dark: "#161613" };
        try {
          var t = localStorage.getItem("best-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", PAPER[t]);
          }
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
