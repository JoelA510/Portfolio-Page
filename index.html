    <!--
      Pre-mount theme hydration.

      CSS tokens live under :root[data-theme="..."], so the attribute must be
      set before first paint. Reads the same localStorage key as
      src/hooks/useTheme.ts ("best-theme"); falls back to OS preference.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("best-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
