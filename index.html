      name="keywords"

    />

      content="Joel Abraham portfolio — AI-augmented software engineering: SquadLogic, PlanterPlan, AI Advocate, and FormWaypoint."
    />

    <!--
      Pre-mount theme hydration.

      CSS tokens live under :root[data-theme="..."], so the attribute must be
      set before first paint. Reads the same localStorage key as
      src/hooks/useTheme.ts ("best-theme"); falls back to OS preference.
      Also seeds the theme-color meta above so mobile browser chrome matches
      on first paint; kept in sync afterwards by useTheme.ts (--paper values).
    -->
    <script>
      (function () {
        var PAPER = { light: "#FAF9F6", dark: "#161613" };
        try {
          var t = localStorage.getItem("best-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", PAPER[t]);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
